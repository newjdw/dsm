<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR 음성 안내 샘플</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    .eyebrow {
      font-size: .85rem;
      color: #666;
      margin-bottom: 4px;
    }
    h1 {
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      margin: 0 0 10px;
      line-height: 1.25;
    }
    .meta {
      color: #666;
      font-size: .95rem;
      margin-bottom: 22px;
    }
    .description {
      font-size: 1.05rem;
      white-space: pre-line;
      margin-bottom: 24px;
    }
    .audio-box {
      border-top: 1px solid #e5e5e5;
      padding-top: 20px;
    }
    .audio-title {
      font-weight: 700;
      margin-bottom: 10px;
    }
    audio {
      width: 100%;
    }
    .hint {
      margin-top: 12px;
      color: #777;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">모바일 QR 안내 샘플</div>
      <h1>샘플 전시물 001</h1>
      <div class="meta">예시 설명 페이지</div>

      <div class="description">이 페이지는 QR 코드를 통해 접속하는 음성 안내 페이지의 샘플입니다.

방문자는 화면에서 설명문을 읽을 수 있고, 아래 재생 버튼을 누르면 미리 만들어 둔 인공음성 파일을 들을 수 있습니다.

실제 사용 시에는 이 부분을 유물, 전시물, 장소, 시설 등에 대한 설명으로 교체하면 됩니다.</div>

      <div class="audio-box">
        <div class="audio-title">음성 설명 듣기</div>
        <audio controls preload="metadata">
          <source src="sample-guide.mp3" type="audio/mpeg" />
          사용 중인 브라우저가 오디오 재생을 지원하지 않습니다.
        </audio>
        <div class="hint">※ 휴대폰에서는 재생 버튼을 눌러 음성을 시작합니다.</div>
      </div>
    </section>
  </main>
</body>
</html>
